# Builds App Monitor and publishes it as a GitHub release when a version tag is pushed.
#   git tag v1.2.0 && git push origin v1.2.0
#
# Release builds are signed with the self-signed "App Monitor Signing" certificate and the
# hardened runtime, so macOS keeps Full Disk Access across updates (docs/specs/disk-cleaner.md
# section 11). The job runs in the "release" environment and needs two secrets there (README,
# "Signing"):
#   APPMON_SIGN_P12           the certificate and private key, as a base64-encoded .p12
#   APPMON_SIGN_P12_PASSWORD  the .p12 password
# Without them the workflow fails before building: it never publishes an ad-hoc build. It also
# refuses tags on commits that aren't on main.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    environment: release   # the signing secrets live in this environment (README, Signing)
    permissions:
      contents: write       # create the release and upload the zip
      id-token: write       # build provenance attestation
      attestations: write
    defaults:
      run:
        shell: bash   # bash --noprofile --norc -eo pipefail: a failing command anywhere in a pipe fails the step
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # full history, for the main ancestry check

      - name: Check the tag is on main
        run: |
          TAGGED="$(git rev-parse HEAD)"
          if ! git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main; then
            echo "::error::Couldn't fetch origin main to check the tag. Nothing was published."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAGGED" refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $TAGGED, which is not on main. Only commits on main are released. Nothing was published."
            exit 1
          fi
          echo "$GITHUB_REF_NAME ($TAGGED) is on main."

      - name: Check signing secrets
        env:
          P12: ${{ secrets.APPMON_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.APPMON_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Signing secrets APPMON_SIGN_P12 and APPMON_SIGN_P12_PASSWORD are not visible to this job. It runs in the \"release\" environment: add both as environment secrets of \"release\" (Settings → Environments → release → Environment secrets), and delete the repository-level copies. See README, Signing. Nothing was published."
            exit 1
          fi

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Logic self-test
        run: scripts/selftest.sh

      - name: Process grouping test
        run: scripts/grouping-test.sh

      - name: Import signing certificate into a temporary keychain
        id: keychain
        env:
          P12: ${{ secrets.APPMON_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.APPMON_SIGN_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/appmon-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"   # random, lives only in this step
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/signing.p12"' EXIT
          printf '%s' "$P12" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # codesign on the runner finds the key only through the user keychain search list
          # ("The specified item could not be found in the keychain" otherwise). Add the temporary
          # keychain in front; the cleanup step restores the list.
          security list-keychains -d user > "$RUNNER_TEMP/keychains-before.txt"
          security list-keychains -d user -s "$KEYCHAIN" $(tr -d '"' < "$RUNNER_TEMP/keychains-before.txt")
          security find-identity -p codesigning "$KEYCHAIN" | grep -q '"App Monitor Signing"' || {
            echo "::error::The .p12 in APPMON_SIGN_P12 has no \"App Monitor Signing\" identity."
            exit 1
          }
          echo "path=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          APPMON_VERSION: ${{ steps.version.outputs.version }}
          APPMON_RELEASE: "1"
          APPMON_SIGN_IDENTITY: App Monitor Signing
          APPMON_SIGN_KEYCHAIN: ${{ steps.keychain.outputs.path }}
        run: AppMonitor/build.sh

      - name: Delete temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/appmon-signing.keychain-db" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/keychains-before.txt" ]; then
            security list-keychains -d user -s $(tr -d '"' < "$RUNNER_TEMP/keychains-before.txt") || true
          fi
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Check the build
        run: |
          APP="AppMonitor/App Monitor.app"
          lipo -archs "$APP/Contents/MacOS/AppMonitor" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/AppMonitor" | grep -q arm64
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist" \
            | grep -qx "${{ steps.version.outputs.version }}"
          # signed with a certificate, not ad-hoc: a cdhash requirement would lose Full Disk Access
          codesign --verify --strict "$APP"
          REQ="$(codesign -d -r- "$APP" 2>&1)"
          if [[ "$REQ" != *'designated => identifier "io.github.laimis91.appmonitor" and certificate leaf'* || "$REQ" == *cdhash* ]]; then
            echo "::error::Release build has no stable designated requirement: $REQ"
            exit 1
          fi
          # hardened runtime on, so no other process can load code into the app and use its Full Disk Access
          CD="$(codesign -dv "$APP" 2>&1 | grep '^CodeDirectory ' || true)"
          if [[ "$CD" != *"flags="*runtime* ]]; then
            echo "::error::Release build is not signed with the hardened runtime: ${CD:-no CodeDirectory}"
            exit 1
          fi
          ENTS="$RUNNER_TEMP/appmon-entitlements.plist"
          codesign -d --entitlements - --xml "$APP" > "$ENTS" 2>/dev/null || true
          if [ "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.automation.apple-events" "$ENTS" 2>/dev/null)" != "true" ]; then
            echo "::error::Release build lacks the com.apple.security.automation.apple-events entitlement"
            exit 1
          fi
          if grep -qE 'disable-library-validation|allow-dyld-environment-variables' "$ENTS"; then
            echo "::error::Release build has an entitlement that weakens the hardened runtime"
            exit 1
          fi
          # developer-only switches must not be in a release build (Cleaner/SystemProbes.swift, Cleaner/Headless.swift, Demo.swift).
          # Swift stores string literals of 15 bytes or fewer inside the code, not as C strings, so
          # `strings` can't see short names such as APPMON_DEMO or APPMON_CAPTURE: for those this
          # only catches longer literals that contain them (usage text, messages).
          BIN="$APP/Contents/MacOS/AppMonitor"
          STRINGS="$RUNNER_TEMP/appmon-strings.txt"
          if ! strings "$BIN" > "$STRINGS" || [ ! -s "$STRINGS" ]; then
            echo "::error::Couldn't read the strings of $BIN"
            exit 1
          fi
          DEBUG_SWITCHES='APPMON_SCAN_ROOT|APPMON_CAPTURE|APPMON_DEMO|Headless mode needs'
          if grep -qE "$DEBUG_SWITCHES" "$STRINGS"; then
            echo "::error::Release build contains developer-only switches: $(grep -oE "$DEBUG_SWITCHES" "$STRINGS" | sort -u | tr '\n' ' ')"
            exit 1
          fi
          # The short names are invisible to strings, so also check that the debug-only code itself
          # (headless scan/clean, window capture) isn't compiled in. Its symbols exist only with APPMON_DEBUG.
          SYMS="$RUNNER_TEMP/appmon-symbols.txt"
          if ! nm "$BIN" > "$SYMS" || [ ! -s "$SYMS" ]; then
            echo "::error::Couldn't read the symbols of $BIN"
            exit 1
          fi
          if grep -qE 'HeadlessO14runIfRequested|captureWindow' "$SYMS"; then
            echo "::error::Release build contains developer-only code (Headless or captureWindow)"
            exit 1
          fi

      - name: Zip
        id: zip
        run: |
          ZIP="AppMonitor-${{ steps.version.outputs.version }}.zip"
          (cd AppMonitor && ditto -c -k --keepParent "App Monitor.app" "../$ZIP")
          SHA256="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Couldn't hash $ZIP"; exit 1; }
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be   # v2.4.0
        with:
          subject-path: ${{ steps.zip.outputs.path }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.zip.outputs.path }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          NOTES="$(printf '%s\n\n%s\n\n%s\n' \
            "Signed with the project's own certificate, not notarized by Apple: on first launch go to System Settings → Privacy & Security and click Open Anyway. Updating from 1.1.0 or earlier (ad-hoc signed): in Full Disk Access, remove App Monitor with the − button, add it again with +, then quit and reopen it. Switching it off and on is not enough." \
            "SHA-256 of $ZIP: \`$SHA256\`" \
            "To check the download before opening it, see \"Verify your download\" in the README.")"
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "App Monitor $VERSION" \
            --generate-notes \
            --notes "$NOTES"

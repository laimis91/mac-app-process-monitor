# Builds App Monitor and publishes it as a GitHub release when a version tag is pushed.
#   git tag v1.1.0 && git push origin v1.1.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the release and upload the zip

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Logic self-test
        run: scripts/selftest.sh

      - name: Build universal app
        env:
          APPMON_VERSION: ${{ steps.version.outputs.version }}
        run: AppMonitor/build.sh

      - name: Check the build
        run: |
          APP="AppMonitor/App Monitor.app"
          lipo -archs "$APP/Contents/MacOS/AppMonitor" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/AppMonitor" | grep -q arm64
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist" \
            | grep -qx "${{ steps.version.outputs.version }}"
          # developer-only switches must not be in a release build
          ! strings "$APP/Contents/MacOS/AppMonitor" | grep -qE 'APPMON_SCAN_ROOT|scan-json'

      - name: Zip
        run: |
          cd AppMonitor
          ditto -c -k --keepParent "App Monitor.app" "../AppMonitor-${{ steps.version.outputs.version }}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "AppMonitor-$VERSION.zip" \
            --title "App Monitor $VERSION" \
            --generate-notes \
            --notes "Ad-hoc signed, not notarized: on first launch go to System Settings → Privacy & Security and click Open Anyway. After updating, switch App Monitor off and on again in Full Disk Access."
